<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232331"/>
      <stop offset="1" stop-color="#0e0e14"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6cf0"/>
      <stop offset="1" stop-color="#1640a8"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eef9"/>
      <stop offset=".35" stop-color="#9fc4ff"/>
      <stop offset=".55" stop-color="#c7a8ff"/>
      <stop offset=".75" stop-color="#ffd38a"/>
      <stop offset="1" stop-color="#d8dde8"/>
    </linearGradient>
    <radialGradient id="shine" cx=".35" cy=".3" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="216" fill="url(#bg)"/>
  <!-- boîtier -->
  <g filter="url(#shadow)" transform="rotate(-8 400 520)">
    <rect x="170" y="210" width="440" height="600" rx="34" fill="url(#case)"/>
    <rect x="170" y="210" width="440" height="96" rx="34" fill="#5d93ff"/>
    <rect x="170" y="270" width="440" height="36" fill="#5d93ff"/>
    <rect x="214" y="342" width="352" height="420" rx="14" fill="#0f1f4d" opacity=".55"/>
    <rect x="234" y="238" width="150" height="40" rx="10" fill="#fff" opacity=".92"/>
  </g>
  <!-- disque -->
  <g filter="url(#shadow)">
    <circle cx="640" cy="560" r="290" fill="url(#disc)"/>
    <circle cx="640" cy="560" r="290" fill="url(#shine)"/>
    <circle cx="640" cy="560" r="286" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="6"/>
    <circle cx="640" cy="560" r="112" fill="#d9deea" opacity=".9"/>
    <circle cx="640" cy="560" r="112" fill="none" stroke="#8a93a8" stroke-opacity=".5" stroke-width="4"/>
    <circle cx="640" cy="560" r="62" fill="#f2b544"/>
    <circle cx="640" cy="560" r="34" fill="#16161c"/>
  </g>
</svg>
